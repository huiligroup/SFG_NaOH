[build-system]
requires = ["setuptools>=61"]
build-backend = "setuptools.build_meta"

[project]
name = "naoh-lqve"
version = "0.1.0"
description = "Local Quantum Vibration Embedding workflow for the NaOH project"
requires-python = ">=3.10"

[tool.setuptools.packages.find]
where = ["."]
include = ["lqve*"]
